name: App KubeShop - publicar imagens

# Ponto de integração com o CI/CD da aplicação (escopo, seção 7).
# A Zibiska Korp já possui CI/CD; aqui ele é representado por este workflow,
# que constrói as imagens a partir do repositório da aplicação e as publica no
# GitHub Container Registry com uma tag explícita. O deploy de infraestrutura
# só consome a tag escolhida (parâmetro docker_tag).
on:
  workflow_dispatch:
    inputs:
      app_repository:
        description: Repositório da aplicação
        type: string
        default: LaercioMLB/kube-shop-v2
      app_ref:
        description: Branch, tag ou commit da aplicação
        type: string
        default: main
      image_tag:
        description: Tag a publicar (ex. 1.0.0, 1.0.1)
        type: string
        default: "1.0.0"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código da aplicação
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.app_repository }}
          ref: ${{ inputs.app_ref }}
          path: app

      - name: Definir registro (minúsculas)
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push - API
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/apps/backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/kubeshop-api:${{ inputs.image_tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build e push - Frontend
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/apps/frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/kubeshop-frontend:${{ inputs.image_tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Resumo
        run: |
          {
            echo "## Imagens publicadas"
            echo "- \`$REGISTRY/kubeshop-api:${{ inputs.image_tag }}\`"
            echo "- \`$REGISTRY/kubeshop-frontend:${{ inputs.image_tag }}\`"
            echo
            echo "Origem: ${{ inputs.app_repository }}@${{ inputs.app_ref }}"
            echo "Use docker_tag=${{ inputs.image_tag }} no workflow de deploy."
          } >> "$GITHUB_STEP_SUMMARY"
