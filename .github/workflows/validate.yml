name: Validar código de infraestrutura

# Sem acesso à AWS: formatação e sintaxe.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"

      - name: Terraform fmt e validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive -diff
          terraform init -backend=false -input=false
          terraform validate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ansible syntax-check
        working-directory: ansible
        run: |
          pip install --quiet "ansible-core>=2.17,<2.19"
          ansible-galaxy collection install -r requirements.yml
          cp inventory/hosts.example.yml inventory/hosts.yml
          for p in playbook.yml ops-*.yml; do
            ansible-playbook --syntax-check "$p"
          done

      - name: ShellCheck dos scripts
        run: shellcheck scripts/*.sh
