- name: Criar diretório de chaves do apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Baixar a chave GPG oficial do Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Adicionar o repositório oficial do Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_arch[ansible_facts.architecture] | default('amd64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_facts.distribution_release }} stable
    filename: docker
    state: present

- name: Instalar Docker Engine (somente se ainda não estiver instalado)
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    lock_timeout: 600

- name: Configurar o daemon (rotação de logs e live-restore)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" },
        "live-restore": true
      }
  notify: Reiniciar Docker

- name: Garantir Docker ativo e habilitado no boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Permitir que o usuário ubuntu use o Docker
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true

- name: Aplicar handlers pendentes antes de subir contêineres
  ansible.builtin.meta: flush_handlers
