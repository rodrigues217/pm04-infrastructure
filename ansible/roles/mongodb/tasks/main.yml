# ---------------------------------------------------------------- volume EBS
# Em instâncias Nitro (t3) o disco aparece como NVMe; o caminho by-id contém o ID
# do volume, então não dependemos de /dev/nvme1n1 vs /dev/xvdf.
- name: Definir o caminho do disco de dados
  ansible.builtin.set_fact:
    mongo_device: "/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_{{ mongo_volume_id | replace('-', '') }}"

- name: Aguardar o volume EBS aparecer na VM
  ansible.builtin.wait_for:
    path: "{{ mongo_device }}"
    timeout: 180

- name: Formatar o volume (somente se ainda estiver vazio; nunca reformata)
  community.general.filesystem:
    dev: "{{ mongo_device }}"
    fstype: ext4

- name: Montar o volume em {{ mongo_data_mount }} (persistente no fstab)
  ansible.posix.mount:
    path: "{{ mongo_data_mount }}"
    src: "{{ mongo_device }}"
    fstype: ext4
    opts: defaults,nofail
    state: mounted

- name: Criar diretórios de dados e backup (dono = usuário mongodb do contêiner, uid 999)
  ansible.builtin.file:
    path: "{{ mongo_data_mount }}/{{ item }}"
    state: directory
    owner: "999"
    group: "999"
    mode: "0750"
  loop: [db, configdb, backup]

# ---------------------------------------------------------------- configuração e segredos
- name: Criar diretório de configuração
  ansible.builtin.file:
    path: "{{ kubeshop_base_dir }}/mongo/secrets"
    state: directory
    owner: "999"
    group: "999"
    mode: "0700"

- name: Gravar senhas do MongoDB (arquivos 0400, nunca exibidos no log)
  ansible.builtin.copy:
    dest: "{{ kubeshop_base_dir }}/mongo/secrets/{{ item.file }}"
    content: "{{ item.value }}"
    owner: "999"
    group: "999"
    mode: "0400"
  loop:
    - { file: mongo_root_password, value: "{{ mongo_root_password }}" }
    - { file: mongo_app_password, value: "{{ mongo_app_password }}" }
  no_log: true

- name: Copiar scripts de inicialização e health check do MongoDB
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ kubeshop_base_dir }}/mongo/{{ item }}"
    mode: "0644"
  loop: [init.js, healthcheck.js]

# ---------------------------------------------------------------- contêiner
- name: Baixar a imagem do MongoDB (tag fixa {{ mongo_tag }})
  community.docker.docker_image:
    name: "{{ mongo_image }}"
    tag: "{{ mongo_tag }}"
    source: pull

- name: Executar o MongoDB (porta publicada somente no IP privado)
  community.docker.docker_container:
    name: mongodb
    image: "{{ mongo_image }}:{{ mongo_tag }}"
    state: started
    restart_policy: unless-stopped
    command: ["--bind_ip_all", "--wiredTigerCacheSizeGB", "{{ mongo_cache_gb }}"]
    env:
      MONGO_INITDB_ROOT_USERNAME: "{{ mongo_root_user }}"
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_INITDB_DATABASE: "{{ mongo_database }}"
      MONGO_APP_USERNAME: "{{ mongo_app_user }}"
      MONGO_APP_PASSWORD_FILE: /run/secrets/mongo_app_password
    volumes:
      - "{{ mongo_data_mount }}/db:/data/db"
      - "{{ mongo_data_mount }}/configdb:/data/configdb"
      - "{{ mongo_data_mount }}/backup:/backup"
      - "{{ kubeshop_base_dir }}/mongo/secrets:/run/secrets:ro"
      - "{{ kubeshop_base_dir }}/mongo/init.js:/docker-entrypoint-initdb.d/10-app-user.js:ro"
      - "{{ kubeshop_base_dir }}/mongo/healthcheck.js:/opt/healthcheck.js:ro"
    # Somente no IP privado: nem a VM expõe 27017 em interface pública,
    # e o security group só aceita conexões vindas da VM da aplicação.
    published_ports:
      - "{{ db_private_ip }}:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--file", "/opt/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opts: ["no-new-privileges:true"]
    stop_timeout: 30
    log_driver: json-file
    log_options:
      max-size: "10m"
      max-file: "3"

- name: Aguardar o MongoDB ficar saudável (healthy)
  community.docker.docker_container_info:
    name: mongodb
  register: mongo_info
  until: mongo_info.container.State.Health.Status | default('') == 'healthy'
  retries: 36
  delay: 5
  changed_when: false
